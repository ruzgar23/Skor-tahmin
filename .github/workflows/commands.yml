name: Bot komutları
# Her çalıştırma ~10 dakika Telegram'ı dinler ve komutlara birkaç saniyede cevap verir.
# 10 dakikada bir yeniden başlatılır; bir önceki bitmeden yenisi beklemeye alınır.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komutlar
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      CMD_SECONDS: "560"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python bot/run.py commands
      - if: always()
        uses: actions/cache/save@v4
        with: { path: state/subs, key: "subs-${{ github.run_id }}" }
